name: Build Desktop Installer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
          - all

jobs:
  build-windows:
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt
          pip install pyinstaller

      - name: Build backend sidecar (PyInstaller)
        run: python -m PyInstaller backend/neurareport-backend.spec --distpath frontend/src-tauri/binaries/ --noconfirm --clean

      - name: Rename sidecar with target triple
        shell: pwsh
        run: |
          Move-Item "frontend/src-tauri/binaries/neurareport-backend.exe" `
                    "frontend/src-tauri/binaries/neurareport-backend-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri desktop app
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx tauri build

      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Windows-Setup
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Windows-MSI
          path: frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-linux:
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt
          pip install pyinstaller

      - name: Build backend sidecar (PyInstaller)
        run: python -m PyInstaller backend/neurareport-backend.spec --distpath frontend/src-tauri/binaries/ --noconfirm --clean

      - name: Rename sidecar with target triple
        run: mv frontend/src-tauri/binaries/neurareport-backend frontend/src-tauri/binaries/neurareport-backend-x86_64-unknown-linux-gnu

      - name: Build Tauri desktop app
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx tauri build

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-deb
          path: frontend/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-rpm
          path: frontend/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-AppImage
          path: frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
