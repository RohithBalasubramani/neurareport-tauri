name: Build Desktop Installer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
          - all

jobs:
  build-windows:
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt
          pip install pyinstaller

      - name: Build backend (PyInstaller onedir)
        run: python -m PyInstaller backend/neurareport-backend.spec --distpath frontend/src-tauri/ --noconfirm --clean

      - name: Verify onedir output
        shell: pwsh
        run: |
          Write-Host "=== Backend folder contents ==="
          Get-ChildItem "frontend/src-tauri/neurareport-backend" | Select-Object Name, Length
          $exe = "frontend/src-tauri/neurareport-backend/neurareport-backend.exe"
          if (Test-Path $exe) {
            Write-Host "OK: $exe exists ($(( Get-Item $exe ).Length / 1MB) MB)"
          } else {
            Write-Host "ERROR: Backend exe not found!"
            exit 1
          }
          $pyc = Get-ChildItem "frontend/src-tauri/neurareport-backend" -Recurse -Filter "*.pyc" | Measure-Object
          Write-Host "Total .pyc files: $($pyc.Count)"

      - name: Test backend starts
        shell: pwsh
        timeout-minutes: 3
        run: |
          Write-Host "Starting backend on port 19876..."
          $env:PYTHONUNBUFFERED = "1"
          $proc = Start-Process -FilePath "frontend/src-tauri/neurareport-backend/neurareport-backend.exe" `
            -ArgumentList "--port","19876" -PassThru `
            -RedirectStandardOutput "sidecar_stdout.txt" `
            -RedirectStandardError "sidecar_stderr.txt"

          $healthy = $false
          for ($i = 1; $i -le 12; $i++) {
            Start-Sleep -Seconds 5
            Write-Host "--- Poll $i ($($i*5)s) ---"
            if ($proc.HasExited) {
              Write-Host "Process EXITED with code $($proc.ExitCode)"
              break
            }
            if (Test-Path "sidecar_stderr.txt") {
              $lines = Get-Content "sidecar_stderr.txt" -ErrorAction SilentlyContinue
              if ($lines) {
                $tail = $lines | Select-Object -Last 3
                Write-Host "  stderr: $($tail -join ' | ')"
              }
            }
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:19876/health" -UseBasicParsing -TimeoutSec 3
              Write-Host "Health check PASSED: $($response.Content)"
              $healthy = $true
              break
            } catch {
              Write-Host "  health: not ready yet"
            }
          }

          Write-Host "`n=== FULL STDERR ==="
          if (Test-Path "sidecar_stderr.txt") { Get-Content "sidecar_stderr.txt" }
          Write-Host "`n=== Process exited: $($proc.HasExited), exit code: $($proc.ExitCode) ==="
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

          if (-not $healthy) {
            Write-Host "::error::Backend health check failed"
            exit 1
          }

      - name: Build Tauri desktop app
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx tauri build

      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Windows-Setup
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Windows-MSI
          path: frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-linux:
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt
          pip install pyinstaller

      - name: Build backend (PyInstaller onedir)
        run: python -m PyInstaller backend/neurareport-backend.spec --distpath frontend/src-tauri/ --noconfirm --clean

      - name: Build Tauri desktop app
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx tauri build

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-deb
          path: frontend/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-rpm
          path: frontend/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-AppImage
          path: frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
