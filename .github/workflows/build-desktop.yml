name: Build Desktop Installer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
          - all

jobs:
  build-windows:
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt
          pip install pyinstaller

      - name: Verify checkout contains critical files
        shell: pwsh
        run: |
          Write-Host "=== Checking backend/app/repositories/state/ ==="
          Get-ChildItem -Path backend/app/repositories/state/ -Recurse
          Write-Host "=== Checking backend/app/repositories/ ==="
          Get-ChildItem -Path backend/app/repositories/ -Recurse -Filter *.py | Select-Object FullName
          Write-Host "=== Total .py files in backend/ (excluding tests/.venv) ==="
          $count = (Get-ChildItem -Path backend/ -Recurse -Filter *.py | Where-Object { $_.FullName -notmatch '(tests|\.venv|__pycache__|migrations)' }).Count
          Write-Host "Total: $count .py files"

      - name: Build backend sidecar (PyInstaller)
        run: python -m PyInstaller backend/neurareport-backend.spec --distpath frontend/src-tauri/ --noconfirm --clean

      - name: Inspect sidecar binary contents
        run: |
          python -c "
          from PyInstaller.archive.readers import CArchiveReader
          exe = 'frontend/src-tauri/neurareport-backend.exe'
          arch = CArchiveReader(exe)
          toc = arch.toc
          # toc is a dict in PyInstaller 6.x: {name: (compress, typecode, offset, length)}
          names = list(toc.keys()) if isinstance(toc, dict) else [str(e) for e in toc]
          print(f'=== CArchive: {len(names)} entries ===')
          repo = [n for n in names if 'repositor' in n or 'state_access' in n]
          print(f'Repo/state entries in CArchive: {repo}')
          pyz = [n for n in names if 'pyz' in n.lower() or 'PYZ' in n]
          print(f'PYZ entries: {pyz}')
          backend = [n for n in names if n.startswith('backend.')]
          print(f'backend.* entries: {len(backend)}')
          print(f'First 10 backend entries: {backend[:10]}')
          if 'backend.app.repositories.state' in names:
              print('OK: backend.app.repositories.state in CArchive')
          else:
              print('NOT in CArchive (may be in PYZ sub-archive)')
          "

      - name: Test sidecar binary starts
        shell: pwsh
        timeout-minutes: 3
        run: |
          Write-Host "Starting sidecar on port 19876..."
          # Force unbuffered Python output so we can read logs in real time
          $env:PYTHONUNBUFFERED = "1"
          $proc = Start-Process -FilePath "frontend/src-tauri/neurareport-backend.exe" `
            -ArgumentList "--port","19876" -PassThru `
            -RedirectStandardOutput "sidecar_stdout.txt" `
            -RedirectStandardError "sidecar_stderr.txt"

          # Poll for health every 5s, up to 90s total
          $healthy = $false
          for ($i = 1; $i -le 18; $i++) {
            Start-Sleep -Seconds 5
            Write-Host "--- Poll $i (${i}x5s = $($i*5)s) ---"

            # Show process status
            if ($proc.HasExited) {
              Write-Host "Process EXITED with code $($proc.ExitCode)"
              break
            }

            # Show latest stderr (tail last 5 lines)
            if (Test-Path "sidecar_stderr.txt") {
              $lines = Get-Content "sidecar_stderr.txt" -ErrorAction SilentlyContinue
              if ($lines) {
                $tail = $lines | Select-Object -Last 5
                Write-Host "  stderr tail: $($tail -join ' | ')"
              }
            }

            # Try health check
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:19876/health" -UseBasicParsing -TimeoutSec 3
              Write-Host "Health check PASSED: $($response.Content)"
              $healthy = $true
              break
            } catch {
              Write-Host "  health: not ready yet"
            }
          }

          # Dump full output
          Write-Host "`n=== FULL STDOUT ==="
          if (Test-Path "sidecar_stdout.txt") { Get-Content "sidecar_stdout.txt" }
          Write-Host "`n=== FULL STDERR ==="
          if (Test-Path "sidecar_stderr.txt") { Get-Content "sidecar_stderr.txt" }
          Write-Host "`n=== Process exited: $($proc.HasExited), exit code: $($proc.ExitCode) ==="

          # Cleanup
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

          if (-not $healthy) {
            Write-Host "::warning::Sidecar health check did not pass within 90 seconds"
          }

      - name: Rename sidecar with target triple
        shell: pwsh
        run: |
          Move-Item "frontend/src-tauri/neurareport-backend.exe" `
                    "frontend/src-tauri/neurareport-backend-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri desktop app
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx tauri build

      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Windows-Setup
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Windows-MSI
          path: frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-linux:
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt
          pip install pyinstaller

      - name: Build backend sidecar (PyInstaller)
        run: python -m PyInstaller backend/neurareport-backend.spec --distpath frontend/src-tauri/ --noconfirm --clean

      - name: Rename sidecar with target triple
        run: mv frontend/src-tauri/neurareport-backend frontend/src-tauri/neurareport-backend-x86_64-unknown-linux-gnu

      - name: Build Tauri desktop app
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx tauri build

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-deb
          path: frontend/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-rpm
          path: frontend/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-AppImage
          path: frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
