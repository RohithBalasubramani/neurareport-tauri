name: Build Desktop Installer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
          - all

jobs:
  build-windows:
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt
          pip install pyinstaller

      - name: Verify checkout contains critical files
        shell: pwsh
        run: |
          Write-Host "=== Checking backend/app/repositories/state/ ==="
          Get-ChildItem -Path backend/app/repositories/state/ -Recurse
          Write-Host "=== Checking backend/app/repositories/ ==="
          Get-ChildItem -Path backend/app/repositories/ -Recurse -Filter *.py | Select-Object FullName
          Write-Host "=== Total .py files in backend/ (excluding tests/.venv) ==="
          $count = (Get-ChildItem -Path backend/ -Recurse -Filter *.py | Where-Object { $_.FullName -notmatch '(tests|\.venv|__pycache__|migrations)' }).Count
          Write-Host "Total: $count .py files"

      - name: Build backend sidecar (PyInstaller)
        run: python -m PyInstaller backend/neurareport-backend.spec --distpath frontend/src-tauri/ --noconfirm --clean

      - name: Inspect sidecar binary contents
        run: |
          python -c "
          import subprocess, sys, zipfile, struct
          exe_path = 'frontend/src-tauri/neurareport-backend.exe'
          # PyInstaller one-file EXEs have a PYZ archive embedded.
          # Use pyi-archive_viewer in non-interactive mode to list TOC.
          try:
              from PyInstaller.archive.readers import CArchiveReader, ZlibArchiveReader
              arch = CArchiveReader(exe_path)
              toc_names = [name for name, *_ in arch.toc]
              print(f'=== CArchive TOC: {len(toc_names)} entries ===')
              # Check for our critical module
              state_mods = [n for n in toc_names if 'repositories' in n or 'state_access' in n]
              print(f'State/repo entries: {state_mods}')
              # Check for PYZ
              pyz_entries = [n for n in toc_names if n.endswith('.pyz')]
              print(f'PYZ archives: {pyz_entries}')
              # Try to read the PYZ and list backend modules
              for pyz_name in pyz_entries:
                  try:
                      pyz_data = arch.extract(pyz_name)
                      # Write to temp file to read
                      import tempfile, os
                      tmp = tempfile.NamedTemporaryFile(suffix='.pyz', delete=False)
                      tmp.write(pyz_data)
                      tmp.close()
                      pyz = ZlibArchiveReader(tmp.name)
                      pyz_mods = [name for name, *_ in pyz.toc]
                      backend_mods = [m for m in pyz_mods if m.startswith('backend.')]
                      print(f'=== PYZ has {len(pyz_mods)} total, {len(backend_mods)} backend modules ===')
                      repo_mods = [m for m in backend_mods if 'repositor' in m or 'state_access' in m]
                      print(f'Repo/state in PYZ: {repo_mods}')
                      if 'backend.app.repositories.state' not in pyz_mods:
                          print('!!! MISSING: backend.app.repositories.state NOT in PYZ !!!')
                      else:
                          print('OK: backend.app.repositories.state IS in PYZ')
                      os.unlink(tmp.name)
                  except Exception as e2:
                      print(f'PYZ read error: {e2}')
          except Exception as e:
              print(f'Archive inspection error: {e}')
              import traceback; traceback.print_exc()
          "

      - name: Test sidecar binary starts
        shell: pwsh
        timeout-minutes: 1
        run: |
          $proc = Start-Process -FilePath "frontend/src-tauri/neurareport-backend.exe" `
            -ArgumentList "--port","19876" -PassThru -NoNewWindow -RedirectStandardError "sidecar_stderr.txt"
          Start-Sleep -Seconds 15
          try {
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:19876/health" -UseBasicParsing -TimeoutSec 5
            Write-Host "Health check: $($response.Content)"
          } catch {
            Write-Host "Health check FAILED: $_"
            if (Test-Path "sidecar_stderr.txt") {
              Write-Host "=== STDERR ==="
              Get-Content "sidecar_stderr.txt"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Rename sidecar with target triple
        shell: pwsh
        run: |
          Move-Item "frontend/src-tauri/neurareport-backend.exe" `
                    "frontend/src-tauri/neurareport-backend-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri desktop app
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx tauri build

      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Windows-Setup
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Windows-MSI
          path: frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-linux:
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt
          pip install pyinstaller

      - name: Build backend sidecar (PyInstaller)
        run: python -m PyInstaller backend/neurareport-backend.spec --distpath frontend/src-tauri/ --noconfirm --clean

      - name: Rename sidecar with target triple
        run: mv frontend/src-tauri/neurareport-backend frontend/src-tauri/neurareport-backend-x86_64-unknown-linux-gnu

      - name: Build Tauri desktop app
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx tauri build

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-deb
          path: frontend/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-rpm
          path: frontend/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-AppImage
          path: frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
