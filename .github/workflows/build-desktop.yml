name: Build Desktop Installer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
          - all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target-triple: x86_64-pc-windows-msvc
            sidecar-ext: .exe
            platform-filter: windows
          - os: ubuntu-22.04
            target-triple: x86_64-unknown-linux-gnu
            sidecar-ext: ''
            platform-filter: linux

    runs-on: ${{ matrix.os }}
    if: >-
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == matrix.platform-filter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- System deps (Linux only) ----------
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # ---------- Rust ----------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      # ---------- Node.js ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ---------- Python ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt
          pip install pyinstaller

      # ---------- Build backend sidecar ----------
      - name: Build backend sidecar (PyInstaller)
        run: |
          python -m PyInstaller backend/neurareport-backend.spec --distpath frontend/src-tauri/binaries/ --noconfirm --clean

      - name: Rename sidecar with target triple (Unix)
        if: runner.os != 'Windows'
        run: |
          mv "frontend/src-tauri/binaries/neurareport-backend" \
             "frontend/src-tauri/binaries/neurareport-backend-${{ matrix.target-triple }}"

      - name: Rename sidecar with target triple (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item "frontend/src-tauri/binaries/neurareport-backend.exe" `
                    "frontend/src-tauri/binaries/neurareport-backend-${{ matrix.target-triple }}.exe"

      # ---------- Build Tauri ----------
      - name: Build Tauri desktop app
        working-directory: frontend
        run: npx tauri build

      # ---------- Upload artifacts ----------
      - name: Upload Windows installer (.exe)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Windows-Installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload Windows MSI installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Windows-MSI
          path: frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Linux .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-deb
          path: frontend/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload Linux .rpm
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-rpm
          path: frontend/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: NeuraReport-Linux-AppImage
          path: frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
